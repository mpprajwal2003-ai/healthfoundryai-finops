name: Sync solutions-finops.md from main site
on:
  repository_dispatch:
    types: [solutions-finops-updated]   # must match Repo A's event_type exactly

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest solutions-finops.md from Repo A
        run: |
          curl -H "Authorization: token ${{ secrets.CROSS_REPO_PAT }}" \
            -H "Accept: application/vnd.github.raw+json" \
            -o src/content/solutions-finops.md \
            https://api.github.com/repos/mpprajwal2003-ai/healthfoundry-main/contents/src/data/solutions-finops.md

      - name: Commit if changed
        run: |
          git config user.name "content-sync-bot"
          git config user.email "bot@yourcompany.com"
          git add src/content/solutions-finops.md
          git diff --staged --quiet || git commit -m "chore: sync solutions-finops.md from main site"
          git push
